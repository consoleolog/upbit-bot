# 서버에서 DB와 봇을 함께 실행한다. 접속 정보는 같은 폴더의 .env(DB_NAME, DB_USER, DB_PASSWORD)에서 읽는다.
# DB만 실행: docker compose up -d db

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
      # 데이터가 비어 있을 때(처음 시작할 때)만 적용된다
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    # 포트를 서버 밖으로 열지 않는다. 봇은 compose 내부 네트워크로만 접속한다
    logging: *logging

  bot:
    build: .
    # 모의 실행 봇(paper-bot)도 이 이미지를 쓴다 (한 번만 빌드)
    image: upbit-bot:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # 업비트 API 키 (실거래와 키 확인 명령에서 쓴다). 없으면 빈 값
      UPBIT_ACCESS_KEY: ${UPBIT_ACCESS_KEY:-}
      UPBIT_SECRET_KEY: ${UPBIT_SECRET_KEY:-}
      # 디스코드 웹훅 알림 (매매 중단·체결). 없으면 알림을 보내지 않는다
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./config/trading.json:/app/config/trading.json:ro
    logging: *logging

  # 모의 실행 봇. .env에 COMPOSE_PROFILES=paper가 있을 때만 뜬다.
  # 실거래 봇과 같은 PostgreSQL을 쓰되 DB는 따로(<DB_NAME>_paper) 쓴다. 같은 DB를 쓰면 마켓별 신호 상태가 섞인다.
  # 모의 DB는 처음 한 번 scripts/init_paper_db.sh로 만든다. 업비트 키는 넘기지 않는다 (공개 시세만 쓴다)
  paper-bot:
    image: upbit-bot:latest
    # 이미지는 bot이 빌드한다. 저장소에서 받으려 하지 않는다
    pull_policy: never
    profiles: ["paper"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "src.main", "--config", "/app/config/trading.paper.json"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}_paper
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # 테스트 알림용 디스코드 웹훅. 없으면 알림을 보내지 않는다
      DISCORD_WEBHOOK_URL: ${PAPER_DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./config/trading.paper.json:/app/config/trading.paper.json:ro
    logging: *logging

volumes:
  db-data:
